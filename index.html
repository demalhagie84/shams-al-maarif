async function ensureData(){const need=[]; if(!V) need.push(fetch('verses.json').then(r=>r.json()).then(d=>V=d)); if(!SQ) need.push(fetch('squares.json').then(r=>r.json()).then(d=>SQ=d)); if(!OP) need.push(fetch('operations.json').then(r=>r.json()).then(d=>OP=d)); if(!MT) need.push(fetch('materials.json').then(r=>r.json()).then(d=>MT=d)); await Promise.all(need)}
function opBrief(o){const b={id:o.id,source:OSRC[o.src],ref:o.ref,title:o.t,categories:o.cat};
  if(o.harm){b.note='Operation against others: summary only. Do not give its procedure.';return b}
  if(o.p) b.purpose=o.p; ['days','pl','hr','moon','el','ord','form','n','val','rc','tm','v','sq','seal'].forEach(k=>{if(o[k]) b[k==='pl'?'planets':k==='hr'?'hours':k==='moon'?'lunar_mansions':k==='el'?'element':k==='ord'?'square_order':k==='n'?'counts':k==='val'?'values':k==='rc'?'recite':k==='tm'?'timing':k==='v'?'verses':k==='sq'?'squares':k]=o[k]});
  if(o.nm) b.names=o.nm.map(nmName); if(o.m) b.materials=o.m.map(k=>M6.mats[k]||k); if(o.sealed) b.sealed='title only in the Iḥyāʾ Engine'; return b}

const XC={};
async function xget(path){if(!XC[path]) XC[path]=fetch(path).then(r=>{if(!r.ok) throw new Error('not loaded: '+path); return r.json()}).catch(e=>{delete XC[path]; throw e}); return XC[path]}
function words(q){return norm(q).split(/[\s,;:.!?()"'«»]+/).filter(w=>w.length>1)}
function score(hay,ws){const h=norm(hay); let s=0; for(const w of ws){const i=h.indexOf(w); if(i<0) return 0; s+=1+h.split(w).length-2} return s}
function clip(t,ws,n){t=String(t); if(t.length<=n) return t; const h=norm(t); const i=Math.max(0,h.indexOf(ws[0]||'')-Math.floor(n/3)); return (i>0?'…':'')+t.slice(i,i+n)+'…'}

  const M = PRAYER_METHODS[methodKey] || PRAYER_METHODS.MWL;
  const jd = julianDay(date.getFullYear(), date.getMonth() + 1, date.getDate()) - lon / 360;
  const { declination: dec, eqt } = sunPosition(jd);
  const dhuhr = fixHour(12 - eqt - lon / 15 + tz);
  const at = (alt) => hourAngle(alt, lat, dec);
  const H = at(-0.833);
  const asrAlt = Math.atan(1 / (asrFactor + Math.tan(Math.abs(lat - dec) * RAD))) * DEG;
  const hAsr = at(asrAlt);
  /* high latitudes (from Kunūz al-Dhikr, 2026-11-22): when the sun never sinks to the Fajr or ʿIshāʾ angle,
     take the angle-based part of the night (angle ÷ 60 of sunset → sunrise) */
  const nightH = H === null ? null : 24 - 2 * H;
  const angleNight = (a) => nightH === null ? null : (a / 60) * nightH;
  let hFajr = at(-M.fajr); if (hFajr === null && nightH !== null) hFajr = H + angleNight(M.fajr);
  let hIsha = M.isha === null ? null : at(-M.isha); if (M.isha !== null && hIsha === null && nightH !== null) hIsha = H + angleNight(M.isha);
  const sunrise = H === null ? null : fixHour(dhuhr - H);
  const sunset  = H === null ? null : fixHour(dhuhr + H);
  return {
    method: M.name, declination: dec, eqt, polar: H === null,
    fajr:    hFajr === null ? null : fixHour(dhuhr - hFajr),
    sunrise, dhuhr: fixHour(dhuhr),
    asr:     hAsr === null ? null : fixHour(dhuhr + hAsr),
    maghrib: sunset,
    isha: hIsha === null ? (sunset === null ? null : fixHour(sunset + (M.ishaOffset || 90) / 60))

    sunset,
  };
}
const hoursToHM = (h) => { if (h === null || h === undefined) return null;
  const m = Math.round(fixHour(h) * 60) % 1440;

const tzOffsetFor = (date) => -date.getTimezoneOffset() / 60;

/**
 * Unequal hours built from true sunrise/sunset for a location and date, with the night
 * carved from this sunset to TOMORROW's sunrise. Before today's sunrise we belong to
 * yesterday's night, so the day ruler is yesterday's.
 */
function planetaryHoursAt(now, lat, lon, tz, methodKey = "MWL") {
  const dayOf = (d) => { const p = prayerTimes(d, lat, lon, tz, methodKey); return p; };
  const atHour = (d, h) => { const x = new Date(d); x.setHours(0,0,0,0); return new Date(x.getTime() + h*3600000); };
  let base = new Date(now);
  let p = dayOf(base);
  if (p.polar) return { polar: true, hours: [], ruler: DAY_RULERS[base.getDay()] };
  let sr = atHour(base, p.sunrise);
  if (now < sr) { base = new Date(now.getTime() - 86400000); p = dayOf(base); sr = atHour(base, p.sunrise); }
  const ss = atHour(base, p.sunset);
  const tomorrow = new Date(base.getTime() + 86400000);
  const pt = dayOf(tomorrow);
  const nextSr = pt.sunrise === null ? new Date(sr.getTime() + 86400000) : atHour(tomorrow, pt.sunrise);
  const dayLen = (ss - sr) / 12, nightLen = (nextSr - ss) / 12;
  const ruler = DAY_RULERS[base.getDay()];
  const start = CHALDEAN.indexOf(ruler);
  const hours = [];
  for (let i = 0; i < 24; i++) {
    const s = i < 12 ? new Date(sr.getTime() + i*dayLen) : new Date(ss.getTime() + (i-12)*nightLen);
    const e = i < 12 ? new Date(sr.getTime() + (i+1)*dayLen) : new Date(ss.getTime() + (i-11)*nightLen);
    hours.push({ i: i+1, planet: CHALDEAN[(start + i) % 7], start: s, end: e, night: i >= 12 });
  }
  return { hours, ruler, sunrise: sr, sunset: ss, nextSunrise: nextSr,
           dayLen: dayLen/3600000, nightLen: nightLen/3600000, polar: false, prayer: p };
}

const SHAKL=(()=>{
/* ═══ The Forge of the Ashkāl — every square of the book rebuilt for another name, number or text ═══
 * Pure functions, no UI. Grids are in the book's visual orientation (as printed, column 0 on the left).
 * Nothing here is the book's own output: each result is the book's figure carried to a new value by a stated
 * operation, and every line is re-summed before it is shown.
 *
 * Methods
 *  own   — on its own arrangement (tarḥ): the figure's cells ranked 1…n² give its base; subtract n(n²−1)/2,
 *          divide by n, add the quotient less one to every cell, and lift the top r·n cells by one (the Ch.19 rule
 *          on the figure's own form). Only when the ranks themselves form a magic square and can take the lift.
 *  carry — the figure's own numbers carried: every cell takes the same addition, and any remainder goes by one
 *          into each line through a Latin arrangement (each row, column — and diagonal when the figure closes on
 *          them — receives it exactly once).
 *  top   — the book's squares whose top row is a name's letters: the top row becomes the new text's segments and
 *          the rest is carried so every line still closes.
 *  darb  — multiplied (the book's second way, p.1970): the quotient of the number by the figure's constant
 *          multiplies every cell, and the remainder goes once into each line along one transversal; for a number
 *          below the constant the number itself multiplies, and the square closes on constant × number.
 *  letters — letter squares: the new text's letters or words take the places of the book's, in the same cycle.
 */

const sumsOf = (g) => {
  const n = g.length, h = g.map(r => r.map(v => (typeof v === "number" ? v : 0)));
  const rows = h.map(r => r.reduce((a, b) => a + b, 0));
  const cols = h[0].map((_, c) => h.reduce((a, r) => a + r[c], 0));
  const d1 = h.reduce((a, r, i) => a + r[i], 0), d2 = h.reduce((a, r, i) => a + r[n - 1 - i], 0);
  const balanced = rows.concat(cols).every(s => s === rows[0]);
  return { rows, cols, d1, d2, balanced, diagonals: balanced && d1 === rows[0] && d2 === rows[0], constant: balanced ? rows[0] : null };
};
const isSq = (g) => Array.isArray(g) && g.length >= 3 && g.every(r => Array.isArray(r) && r.length === g.length);
const distinct = (g) => { const f = g.flat().filter(v => v != null); return new Set(f).size === f.length; };
const positive = (g) => g.flat().every(v => v == null || (Number.isInteger(v) && v > 0));

/** The ranks of the cells, 1…n² (only for distinct whole numbers). */
function rankOf(g) {
  const n = g.length, flat = g.flat().map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]), P = new Array(n * n);
  flat.forEach(([, i], k) => (P[i] = k + 1));
  return Array.from({ length: n }, (_, r) => P.slice(r * n, r * n + n));
}

/* ───────── Latin arrangements and transversals, found by search ───────── */
/** Latin squares with first row 0…n−1 (and, with diag, both diagonals permutations too). A generator: a known
 *  construction first where one exists, then a seeded randomized search with restarts (the same order every time). */
function* latinSquares(n, diag, limit = 4000) {
  const seen = new Set(); let k = 0;
  const emit = (L) => { const key = L.map(r => r.join(",")).join(";"); if (seen.has(key)) return false; seen.add(key); return true; };
  if (!diag || (n % 2 === 1 && n % 3 !== 0)) {
    for (let s = 1; s < n; s++) {
      if (gcd(s, n) !== 1 || (diag && (gcd(s + 1, n) !== 1 || gcd(Math.abs(s - 1), n) !== 1))) continue;
      const L = Array.from({ length: n }, (_, r) => Array.from({ length: n }, (_, c) => (c + r * s) % n));
      if (emit(L)) { yield L; if (++k >= limit) return; }
    }
  }
  let seed = 2166136261 ^ (n * 7919 + (diag ? 1 : 0));
  const rnd = () => { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; };
  for (let restart = 0; restart < 400 && k < limit; restart++) {
    const L = Array.from({ length: n }, (_, r) => r === 0 ? [...Array(n).keys()] : new Array(n).fill(-1));
    const col = Array.from({ length: n }, (_, c) => new Set([c])), row = Array.from({ length: n }, () => new Set());
    const d1 = new Set([0]), d2 = new Set([n - 1]); let steps = 0, found = false;
    const order = Array.from({ length: n }, () => [...Array(n).keys()]);
    const fill = (pos) => {
      if (++steps > 30000) return false;
      if (pos === n * n) return true;
      const r = Math.floor(pos / n), c = pos % n;
      if (c === 0) { const o = order[r]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } }
      for (const s of order[r]) {
        if (row[r].has(s) || col[c].has(s)) continue;
        const a = diag && r === c, b = diag && r + c === n - 1;
        if ((a && d1.has(s)) || (b && d2.has(s))) continue;
        L[r][c] = s; row[r].add(s); col[c].add(s); if (a) d1.add(s); if (b) d2.add(s);
        if (fill(pos + 1)) return true;
        L[r][c] = -1; row[r].delete(s); col[c].delete(s); if (a) d1.delete(s); if (b) d2.delete(s);
      }
      return false;
    };
    found = fill(n);
    if (found && emit(L)) { yield L.map(r => r.slice()); k++; }

}
const gcd = (a, b) => b ? gcd(b, a % b) : a;
/** Found once per order and kept: the arrangements every forging of that order draws on. */
const LATIN_CACHE = new Map();
function latinList(n, diag, want = 40) {
  if (diag && n === 3) return [];
  const key = n + (diag ? "d" : "");
  let c = LATIN_CACHE.get(key);
  if (!c) { c = { list: [], gen: latinSquares(n, diag, 400), done: false }; LATIN_CACHE.set(key, c); }
  while (!c.done && c.list.length < want) { const x = c.gen.next(); if (x.done) c.done = true; else c.list.push(x.value); }
  return c.list;
}
/** Transversals: one cell in every row and column, none on a hollow cell; with diag, exactly one on each diagonal. */
function* transversals(g, diag, limit = 400) {
  const n = g.length, used = new Array(n).fill(false), p = new Array(n);
  let k = 0, steps = 0;
  function* go(r, m1, m2) {
    if (++steps > 200000) return;
    if (r === n) { if (!diag || (m1 === 1 && m2 === 1)) yield p.slice(); return; }
    for (let t = 0; t < n; t++) {
      const c = (t + r) % n;
      if (used[c] || g[r][c] == null) continue;
      const a = m1 + (r === c ? 1 : 0), b = m2 + (r + c === n - 1 ? 1 : 0);
      if (diag && (a > 1 || b > 1)) continue;
      used[c] = true; p[r] = c; yield* go(r + 1, a, b); used[c] = false;
    }
  }
  for (const x of go(0, 0, 0)) { yield x; if (++k >= limit) return; }
}

/* ───────── reading a figure ───────── */
/** Turn a book grid into values. Strings count by their abjad (ab), null stays hollow. A word written in the very
 *  centre of an odd square that otherwise does not close is read as the hollow centre with its name. */
function analyse(grid, ab) {
  if (!isSq(grid)) return { kind: "plate", why: "not a square grid" };
  const n = grid.length, flat = grid.flat();
  const allStr = flat.every(v => typeof v === "string");
  const toVal = (v) => v == null ? null : typeof v === "number" ? v : ab(v);
  let values = grid.map(r => r.map(toVal)), centre = null;
  let s = sumsOf(values);
  if (!s.balanced && n % 2 === 1 && typeof grid[(n - 1) / 2][(n - 1) / 2] === "string" && !allStr) {
    const m = (n - 1) / 2, v2 = values.map(r => r.slice()); v2[m][m] = null;
    const s2 = sumsOf(v2);
    if (s2.balanced) { values = v2; s = s2; centre = grid[m][m]; }
  }
  const hollow = values.flat().some(v => v == null);
  const out = { n, values, hollow, centre, constant: s.constant, closes: s.balanced, diagonals: s.diagonals, methods: [] };
  // letter squares
  if (allStr) {
    const L = letterPattern(grid);
    if (L) { out.letters = L; out.methods.push("letters"); }
  }
  // a name's letters across the top row of a numeric square
  if (!allStr && grid[0].every(v => typeof v === "string") && grid.slice(1).every(r => r.every(v => typeof v === "number"))) out.topRow = true;
  if (!s.balanced || values.flat().some(v => v != null && !Number.isInteger(v))) {
    if (!out.methods.length) { out.kind = "plate"; out.why = "its lines do not close as printed"; }
    else out.kind = "letters";
    return out;
  }
  out.kind = allStr ? "letters" : hollow ? "hollow" : "numeric";
  // a square printed already multiplied (every cell sharing a factor) is multiplied again from its base
  const g = values.flat().filter(v => v != null).reduce((a, b) => gcd(a, Math.abs(b)), 0);
  if (g > 1) { out.unit = g; out.base = values.map(r => r.map(v => v == null ? null : v / g)); }
  if (!hollow && distinct(values)) {
    const P = rankOf(values), sp = sumsOf(P);
    if (sp.balanced && sp.constant === n * (n * n + 1) / 2 && (sp.diagonals || !s.diagonals)) { out.pattern = P; out.methods.push("own"); }
  }
  if (out.topRow && !hollow) out.methods.push("top");
  if (!hollow) out.methods.push("carry");
  out.methods.push("darb");
  return out;
}

/** How a letter square repeats: each row a turn of the first (cycle), or each letter once in every row and column (latin). */
function letterPattern(grid) {
  const n = grid.length, r0 = grid[0];
  const offs = grid.map(row => [...Array(n).keys()].filter(k => row.every((x, c) => x === r0[(c + k) % n])));
  if (offs.every(o => o.length)) {
    // prefer a steady step from row to row, so columns carry every place once
    for (let s = 0; s < n; s++) if (offs.every((o, r) => o.includes((r * s) % n))) return { type: "cycle", offsets: offs.map((_, r) => (r * s) % n), places: n };
    return { type: "cycle", offsets: offs.map(o => o[0]), places: n };
  }
  const syms = [...new Set(grid.flat())];
  if (syms.length === n && grid.every(r => new Set(r).size === n) && r0.every((_, c) => new Set(grid.map(r => r[c])).size === n)) {
    const order = r0.slice().reverse();          // the name as it reads, right to left
    return { type: "latin", index: grid.map(r => r.map(x => order.indexOf(x))), places: n };
  }
  return null;
}

/** +1 along r disjoint transversals that each cross both diagonals once, keeping every cell distinct. */
function liftPaths(base, r) {
  const n = base.length;
  for (const L of latinList(n, true)) {
    const g = base.map((row, i) => row.map((v, j) => v + (L[i][j] < r ? 1 : 0)));
    if (distinct(g)) return g;
  }
  return null;
}

/* ───────── the methods ───────── */
const floorOf = (n) => n * (n * n - 1) / 2 + n;   // least number the tarḥ can take (k ≥ 1)

function forgeOwn(A, P) {
  const n = P.length, sub = n * (n * n - 1) / 2, diff = A - sub;
  if (!Number.isInteger(A) || A <= 0) return { error: "the number must be a whole positive number" };
  if (diff < n) return { error: `below this figure's floor — it needs at least ${sub + n}` };
  const k = Math.floor(diff / n), rem = diff % n, th = n * n - rem * n;
  if (rem) {
    const rows = P.map(r => r.filter(v => v > th).length), cols = P[0].map((_, c) => P.filter(r => r[c] > th).length);
    if (!rows.concat(cols).every(x => x === rem)) return { error: `this arrangement cannot take a remainder of ${rem} — its top ${rem * n} cells do not fall ${rem} to every row and column` };
  }
  let grid = P.map(r => r.map(v => v + (k - 1) + (rem && v > th ? 1 : 0)));
  let note = null;
  if (rem && sumsOf(P).diagonals && !sumsOf(grid).diagonals) {
    // the book's lift keeps rows and columns; look for a lift through r paths that keeps the diagonals too
    const base = P.map(r => r.map(v => v + (k - 1)));
    const alt = liftPaths(base, rem);
    if (alt) { grid = alt; note = `the remainder goes by one into ${rem} cell${rem > 1 ? "s" : ""} of every line (rows, columns and both diagonals) instead of the top ${rem * n} — the book's lift would leave the diagonals off`; }
    else note = n === 3 ? "with a remainder the threefold closes on its rows and columns only — as the book's own rule does (p.1703)" : "with this remainder the lift closes rows and columns; the diagonals differ";
  }
  return { grid, k, rem, note, how: `${A} − ${sub} = ${diff}; ÷ ${n} = ${k}${rem ? ` remainder ${rem}` : ""}; ${k - 1 >= 0 ? `+${k - 1}` : k - 1} to every rank${rem ? `, +1 to the top ${rem * n}` : ""}` };
}

/** Add Δ = d[L] to G: every line with each symbol once gains Σd. Searches Latin squares until the cells stay distinct and positive. */
function addLatin(G, d, diag, keepTop) {
  const n = G.length; let best = null;
  for (const L of latinList(n, diag)) {
    const g = G.map((r, i) => r.map((v, j) => v + d[L[i][j]]));
    if (!positive(g)) { best = best || { grid: g, bad: "positive" }; continue; }
    if (distinct(g) || keepTop) return { grid: g, L };
    best = best && best.bad === "distinct" ? best : { grid: g, L, bad: "distinct" };

}

function forgeCarry(A, values, diag) {
  const n = values.length, C = sumsOf(values).constant, D = A - C;
  if (!Number.isInteger(A) || A <= 0) return { error: "the number must be a whole positive number" };
  const k = Math.floor(D / n), r = ((D % n) + n) % n;
  if (!r) {
    const grid = values.map(row => row.map(v => v + k));
    if (!positive(grid)) return { error: `too small: carrying ${C} down to ${A} takes a cell below one` };
    return { grid, k, rem: 0, how: `${A} − ${C} = ${D}; ÷ ${n} = ${k}: ${k >= 0 ? "+" : ""}${k} to every cell` };
  }
  if (diag && n === 3) return { error: "a 3×3 closing on its diagonals carries only in steps of 3 — use its own arrangement" };
  // r symbols take k+1, the rest k
  const d = [...Array(n).keys()].map(j => k + (j < r ? 1 : 0));
  const res = addLatin(values, d, diag);
  if (!res) return { error: "no Latin arrangement found for this order" };
  if (res.bad === "positive") return { error: `too small: carrying ${C} down to ${A} takes a cell below one` };
  return { grid: res.grid, k, rem: r, repeats: res.bad === "distinct",
    how: `${A} − ${C} = ${D}; ÷ ${n} = ${k} remainder ${r}: ${k >= 0 ? "+" : ""}${k} to every cell and one more to ${r} cell${r > 1 ? "s" : ""} of every line` };
}

/** The top row becomes the new segments' values (segVals given in reading order, right to left). */
function forgeTop(values, segVals, diag) {
  const n = values.length;
  if (segVals.length !== n) return { error: `the top row has ${n} places — the text gives ${segVals.length}` };
  const u = segVals.slice().reverse();                 // visual left-to-right
  const d = u.map((x, j) => x - values[0][j]);

  const res = addLatin(values, d, diag, true);
  if (!res) return { error: "no Latin arrangement found for this order" };
  if (res.bad === "positive") return { error: "this text's letters are too far from the book's — a cell falls below one" };
  return { grid: res.grid, repeats: !distinct(res.grid), how: `each top cell moves to its letter's value; the same moves are carried through every line once` };
}

function forgeDarb(A, values, diag, byNumber) {

    return { grid, q: A, rem: 0, byNumber: true, constant: C * A, how: `every cell × ${A}: the square closes on ${C} × ${A} = ${C * A}` };
  }
  const q = Math.floor(A / C), r = A - q * C;
  const base = values.map(row => row.map(v => v == null ? null : v * q));
  if (!r) return { grid: base, q, rem: 0, constant: A, how: `${A} ÷ ${C} = ${q}: every cell × ${q}` };
  let fallback = null;

  for (const p of transversals(values, dg)) {
    const g = base.map((row, i) => row.map((v, j) => (j === p[i] ? v + r : v)));
    if (distinct(g)) { const o = { grid: g, q, rem: r, constant: A, cells: p, how: `${A} ÷ ${C} = ${q} remainder ${r}: every cell × ${q}, and ${r} into one cell of every line` };
      if (!diag || dg) return o; fallback = fallback || o; continue; }
    fallback = fallback || { grid: g, q, rem: r, constant: A, cells: p, repeats: true, how: `${A} ÷ ${C} = ${q} remainder ${r}: every cell × ${q}, and ${r} into one cell of every line` };
  }
  if (fallback) break;
  }
  if (fallback && diag && !sumsOf(fallback.grid).diagonals) fallback.note = `no single path crosses every row, column and both diagonals of this ${n}×${n} once, so the remainder closes rows and columns only; for the diagonals too, give a multiple of ${C}`;

/** Letter squares: the segments (in reading order) take the book's places. */
function forgeLetters(grid, L, segs) {
  const n = grid.length;
  if (segs.length !== L.places) return { error: `this square has ${L.places} places — the text gives ${segs.length}` };
  if (L.type === "cycle") {
    const seq = segs.slice().reverse();                 // the first row as printed, left to right
    return { grid: grid.map((row, r) => row.map((_, c) => seq[(c + L.offsets[r]) % n])) };
  }
  return { grid: L.index.map(r => r.map(i => segs[i])) };

/** Run a method. opts: { A, segs, segVals, byNumber } */
function forge(an, method, opts, ab) {
  const diag = !!an.diagonals;

  else if (method === "carry") res = forgeCarry(opts.A, an.values, diag);
  else if (method === "top") res = forgeTop(an.values, opts.segVals || [], diag);

  const drawC=()=>{const el=document.getElementById('opForge'); if(!el) return; const c=ch[OPC]; const r=forgeCompute({text:c.text,num:c.num,order:ord,mode:'wafq',form:'fire'});

function moonSVG(illum,waxing,size){const r=size/2-2, c=size/2; const k=1-2*illum; const rx=Math.abs(k)*r; // terminator ellipse

  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="Moon '+Math.round(illum*100)+'% lit"><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="'+dark+'" stroke="var(--line)"/><path d="'+d+'" fill="'+lit+'"/></svg>'}
function mansionWheel(n,lon,size){const c=size/2, R=c-4, r0=R-22; let s='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="Lunar mansion '+n+' of 28">';
  for(let i=0;i<28;i++){const a0=(i*360/28-90)*Math.PI/180, a1=((i+1)*360/28-90)*Math.PI/180; const P=(rr,a)=>(c+rr*Math.cos(a)).toFixed(1)+' '+(c+rr*Math.sin(a)).toFixed(1);
    const on=i+1===n; s+='<path d="M'+P(r0,a0)+' L'+P(R,a0)+' A'+R+' '+R+' 0 0 1 '+P(R,a1)+' L'+P(r0,a1)+' A'+r0+' '+r0+' 0 0 0 '+P(r0,a0)+' Z" fill="'+(on?'var(--gold-hi)':(i%7===0?'var(--lapis-soft)':'var(--panel)'))+'" stroke="var(--line)"/>';
    if((i+1)%7===1||on){const am=((i+.5)*360/28-90)*Math.PI/180; s+='<text x="'+(c+(r0+11)*Math.cos(am)).toFixed(1)+'" y="'+(c+(r0+11)*Math.sin(am)+3.5).toFixed(1)+'" font-size="9" text-anchor="middle" fill="'+(on?'#1a1405':'var(--muted)')+'" font-family="IBM Plex Mono, monospace">'+(i+1)+'</text>'}}
